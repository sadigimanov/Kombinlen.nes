        <h1>👕 Günlük Kombin Seçimi</h1>


        <!-- Papaq -->
        <div class="section" data-type="papag">
            <h2>Papaq</h2>
            <input type="file" accept="image/*" class="upload" onchange="uploadImage(event, 'papaq')">
            <button class="btn" onclick="deleteImage('papaq')">🗑 Sil</button>
            <div class="slider">
                <button class="btn" onclick="prev('papaq')">◀</button>
                <img id="papaq-display" src="" alt="Papaq seçilməyib">
                <button class="btn" onclick="next('papaq')">▶</button>
            </div>

        </div>
