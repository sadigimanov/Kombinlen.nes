<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kombinnes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Kombin Qur</h1>

  <div class="container">
    <!-- Papaq -->
    <div class="item">
      <h2>Papaq</h2>
      <div class="controls">
        <button onclick="prev('papaq')">◀</button>
        <img id="papaq-display" class="display" alt="papaq şəkli yoxdur">
        <button onclick="next('papaq')">▶</button>
      </div>
      <input type="file" accept="image/*" onchange="uploadImage(event,'papaq')">
      <button onclick="deleteImage('papaq')">Sil</button>
    </div>

    <!-- Köynək -->
    <div class="item">
      <h2>Köynək</h2>
      <div class="controls">
        <button onclick="prev('koynek')">◀</button>
        <img id="koynek-display" class="display" alt="köynək şəkli yoxdur">
        <button onclick="next('koynek')">▶</button>
      </div>
      <input type="file" accept="image/*" onchange="uploadImage(event,'koynek')">
      <button onclick="deleteImage('koynek')">Sil</button>
    </div>

    <!-- Şalvar -->
    <div class="item">
      <h2>Şalvar</h2>
      <div class="controls">
        <button onclick="prev('salvar')">◀</button>
        <img id="salvar-display" class="display" alt="şalvar şəkli yoxdur">
        <button onclick="next('salvar')">▶</button>
      </div>
      <input type="file" accept="image/*" onchange="uploadImage(event,'salvar')">
      <button onclick="deleteImage('salvar')">Sil</button>
    </div>

    <!-- Ayaqqabı -->
    <div class="item">
      <h2>Ayaqqabı</h2>
      <div class="controls">
        <button onclick="prev('ayaqqabi')">◀</button>
        <img id="ayaqqabi-display" class="display" alt="ayaqqabı şəkli yoxdur">
        <button onclick="next('ayaqqabi')">▶</button>
      </div>
      <input type="file" accept="image/*" onchange="uploadImage(event,'ayaqqabi')">
      <button onclick="deleteImage('ayaqqabi')">Sil</button>
    </div>
  </div>

  <h2>Sənin Kombinin</h2>
  <div class="kombin">
    <img id="kombin-papaq" class="kombin-img" alt="">
    <img id="kombin-koynek" class="kombin-img" alt="">
    <img id="kombin-salvar" class="kombin-img" alt="">
    <img id="kombin-ayaqqabi" class="kombin-img" alt="">
  </div>

  <script src="app.js"></script>
</body>
</html>
